<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f13" media="(prefers-color-scheme: dark)">
  <title>You're offline - Get-ly</title>
  <style>
    :root { --bg: #f7f7f9; --surface: #ffffff; --text: #17171c; --muted: #6b6b7a; --border: #e6e6eb; --accent: #5145e5; --accent-text: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0f13; --surface: #16161c; --text: #ececf1; --muted: #9494a4; --border: #272730; --accent: #6c63f6; --accent-text: #ffffff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; max-width: 380px; width: 100%; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    button { font: inherit; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Get-ly needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
