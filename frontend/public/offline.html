<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5eff">
  <title>You're offline - Get-ly</title>
  <style>
    :root { --bg: #f6f7f9; --surface: #ffffff; --text: #16202c; --muted: #5d6b7a; --border: #dfe3e8; --accent: #1f5eff; --accent-text: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11161c; --surface: #1a2129; --text: #e8edf2; --muted: #9aa7b4; --border: #2d3743; --accent: #5b8cff; --accent-text: #0d1117; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; max-width: 380px; width: 100%; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 20px; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    button { font: inherit; background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Get-ly needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
